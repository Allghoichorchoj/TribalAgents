<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tribal Agents 1.0</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%90%B9%3C/text%3E%3C/svg%3E">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f1f3ef;--panel:#fff;--ink:#2b3a33;--mute:#6b7a72;--line:#e3e7e2;--green:#2f7d57;--btn:#f2f3f1;--sel:#e8f0ea;--grid:#e6eae4;--obs:#e8eae6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b211e;--panel:#232a26;--ink:#e3ebe6;--mute:#94a39b;--line:#323b36;--green:#5fbf8c;--btn:#2d3631;--sel:#2c3a32;--grid:#242c28;--obs:#2d3530}}
:root[data-theme="dark"]{--bg:#1b211e;--panel:#232a26;--ink:#e3ebe6;--mute:#94a39b;--line:#323b36;--green:#5fbf8c;--btn:#2d3631;--sel:#2c3a32;--grid:#242c28;--obs:#2d3530}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:13px "Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
#fsbtn,#fsbtn:hover,#fsbtn.on{position:absolute;right:7px;top:50%;transform:translateY(-50%);line-height:0;padding:4px;color:#000!important;opacity:1!important;background:none!important;border:0!important;box-shadow:none!important;border-radius:0;cursor:pointer}
header{position:relative;height:45px;box-sizing:border-box;font-size:13px;display:flex;align-items:center;gap:8px;padding:5px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:nowrap;white-space:nowrap;overflow:hidden;flex:none}header>*{flex:none}header .perf{flex:1 1 0!important;min-width:0!important;overflow:hidden;text-overflow:ellipsis}
h1{font-size:inherit;font-weight:600;color:var(--green);margin:0 6px 0 0}
button{font:inherit;font-size:15px;color:var(--ink);background:var(--btn);border:1px solid var(--line);border-radius:8px;padding:8px 16px;cursor:pointer}
button:hover{border-color:var(--green)}
button.on{background:var(--sel);border-color:var(--green)}
header button{padding:5px 14px;font-size:13px;border-radius:7px}
.sp{display:flex;gap:6px;margin-left:8px}
header h1{font-family:"Caesar Dressing",Impact,"Segoe UI",sans-serif;font-weight:400;font-size:1.9em;line-height:1.05}
header h1 #ver{font-family:"Segoe UI",system-ui,sans-serif;font-size:13px;line-height:1;font-weight:400;color:var(--mute);margin-left:4px}
header.c1{font-size:13px;gap:5px;padding:4px 8px}header.c1 button{padding:5px 10px;font-size:13px}header.c1 h1{margin-right:2px}
header.c2{font-size:13px;gap:3px;padding:4px 6px}header.c2 button{padding:5px 8px;font-size:13px}header.c2 h1{margin-right:0}header.c2 .sl{gap:3px;margin-left:0}header.c2 .tg{gap:3px;margin-left:0}
header.c3{font-size:13px;gap:2px;padding:3px 4px}header.c3 button{padding:4px 6px;font-size:13px}header.c3 h1{margin-right:0}header.c3 .sl{gap:2px;margin-left:0}header.c3 .tg{gap:2px;margin-left:0}header.c3 .sl output{width:auto!important;min-width:0}
.tg{display:flex;align-items:center;gap:5px;margin-left:2px;cursor:pointer;user-select:none;color:var(--ink)}.tg input{accent-color:var(--green);margin:0;cursor:pointer}
.sl,.sl .ic,.sl input{cursor:pointer}.sl .ic{font-size:1.15em;line-height:1}
.sl{flex:none;display:flex;align-items:center;gap:5px;margin-left:2px;color:var(--mute)}.sl input{accent-color:var(--green);flex:none;width:var(--sw,110px)}.sl output{width:26px;color:var(--ink)}.ver{color:var(--mute);font-size:inherit}
.ag .x{padding:0 5px;border:0;background:transparent;color:var(--mute);font-size:12px;line-height:1.3}.ag .x:hover{color:#c4553f}
.ag small{display:block;color:var(--mute);font-size:10.5px;margin:-2px 0 5px 17px}
.on{background:var(--sel)!important;border-color:var(--green)!important}
#cv.form{cursor:default}
.perf{min-width:46ch;text-align:right;margin-left:auto;color:var(--mute);font-size:inherit;font-variant-numeric:tabular-nums;white-space:nowrap;flex:0 0 auto!important;min-width:56ch}
.hint{margin-left:auto;color:var(--mute);font-size:12px}
main{flex:1;display:flex;min-height:0}
#list{width:220px;flex:none;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:12px 8px}
#list h2,#net h2{font-size:12px;font-weight:600;color:var(--mute);margin:0 0 10px 5px}
.ag{padding:8px 10px 9px;border-radius:6px;border:1px solid transparent;cursor:pointer;margin-bottom:2px;content-visibility:auto;contain-intrinsic-size:auto 48px}
.ag.s{background:var(--sel);border-color:var(--green)}
.ag .r{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.ag i{width:9px;height:9px;border-radius:50%}
.ag b{font-weight:500;flex:1}.ag b .gm{color:inherit;font-size:1.15em;font-weight:900;-webkit-text-stroke:1.1px currentColor}.ag span{color:var(--mute);font-size:11px}
.bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden}.bar div{height:100%;background:var(--green)}
.empty{color:var(--mute);padding:6px;line-height:1.5}
#env{flex:1;min-width:0;position:relative;background:var(--bg)}
#env .perf{pointer-events:none;position:absolute;top:8px;left:12px;right:auto;margin:0;min-width:0!important;flex:none!important;z-index:5;text-align:left;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.75),0 0 3px rgba(0,0,0,.6);background:transparent}
#log{position:absolute;left:12px;bottom:10px;display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:4px;max-width:70%;pointer-events:none}
@keyframes nfade{0%,50%{opacity:1}100%{opacity:0}}#log div{color:#fff;font-size:13px;font-family:"Segoe UI",system-ui,sans-serif;font-weight:400;font-variant-numeric:tabular-nums;text-shadow:0 1px 2px rgba(0,0,0,.75),0 0 3px rgba(0,0,0,.6)}
#sndbtn{position:absolute;right:12px;bottom:10px;z-index:6;padding:0;margin:0;font:400 26px/1 "Segoe UI",system-ui,sans-serif;background:none;border:0;border-radius:0;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.75),0 0 3px rgba(0,0,0,.6);cursor:pointer}#sndbtn:hover{transform:scale(1.1)}#sndbtn.off{opacity:.8}
canvas{touch-action:none;position:absolute;inset:0;width:100%;height:100%;cursor:default}
#net{position:relative;width:290px;flex:none;overflow-x:hidden;overflow-y:auto;display:flex;flex-direction:column;background:var(--panel);border-left:1px solid var(--line);padding:12px 6px}
#net>*{flex:none}
#net #evildoc{display:block;position:absolute;left:0;right:0;bottom:0;width:100%;height:auto;max-height:2000px;margin:0;border-radius:0;opacity:1;transition:opacity .8s ease,max-height 0s .8s,margin 0s .8s}
#net.empty>:not(#evildoc):not(#bub){display:none}
#net.empty{border-left:0;overflow:visible}
#net.nosel>:not(#evildoc):not(#bub){display:none} /* agents exist but none is selected: right panel shows no text */
#bub{position:absolute;left:5px;right:5px;bottom:5px;margin:0;box-sizing:border-box;min-height:36px;display:flex;align-items:center;justify-content:center;padding:5px 12px;background:rgba(255,255,255,.75);color:#000;border:1px solid #9a9a9a;border-radius:10px;font:400 13px/1.2 "Segoe UI",system-ui,sans-serif;text-align:center;z-index:3;pointer-events:none;opacity:0;visibility:hidden;transform:scale(.96);transform-origin:50% 100%;transition:opacity .7s ease,transform .5s ease,visibility 0s .7s}
#net.empty #bub.talk{opacity:1;visibility:visible;transform:none;transition:opacity .22s ease,transform .22s ease,visibility 0s}
@keyframes evfade{from{opacity:0}to{opacity:1}}
#net #evildoc.pre{opacity:0}
#net.empty #evildoc.fi{animation:evfade 3.5s ease-in-out backwards} /* the picture slowly fades in */
#net.empty #evildoc.gone{opacity:0;transition:opacity 3s ease} /* idle after the joke: the picture slowly fades away */
#net:not(.empty) #evildoc{opacity:0;max-height:0;margin:0;pointer-events:none}
#net .t{color:var(--mute);font-size:12px;margin:0 5px 4px;min-height:30px}
#net .gs{font-weight:900;-webkit-text-stroke:.9px currentColor}
#net .who{font-size:14px;font-weight:600;color:var(--ink);margin-bottom:6px}
#net .kv{display:grid;grid-template-columns:92px 1fr;gap:3px 8px;line-height:1.35}
#net .kv span{color:var(--mute)}#net .kv b{font-weight:500;color:var(--ink)}
#net hr{border:0;border-top:1px solid var(--line);margin:8px 0}
#net{overflow-y:auto}#lin{margin:0 5px;font:11px/1.45 ui-monospace,Consolas,monospace;color:var(--mute);white-space:pre-wrap}
svg text{font-size:11px;fill:var(--mute)}
@media(max-width:820px){main{flex-wrap:wrap}#list{width:100%;height:110px;border:0}#net{width:100%;order:3}#env{flex:1 1 100%;height:60vh}#net #evildoc,#bub{display:none}#net.empty>:not(#evildoc):not(#bub){display:revert}#net.nosel>:not(#evildoc):not(#bub){display:none}}
</style>

<header>
<h1>Tribal Agents<span id="ver" title="2026"></span></h1>
<button id="play">▶ Play</button><button id="pause">⏸ Pause</button><button id="refresh">⟳ Refresh</button><button id="formtribe">✦ Form a tribe</button>
<label class="sl" title="Simulation speed"><span class="ic">⌛</span><input type="range" id="spd" min="0" max="3" step="1" value="0"><output id="spo">1x</output></label>
<label class="sl" title="Food per click"><span class="ic">🍎</span><input type="range" id="fq" min="10" max="100" step="5" value="25"><output id="fqo" style="width:26px">25</output></label>
<label class="sl" title="Auto food"><span class="ic">🍄‍🟫</span><input type="range" id="af" min="0" max="2000" step="5" value="100"><output id="afo" style="width:36px">100</output></label>
<label class="sl" title="Reproduction rate"><span class="ic">❤️</span><input type="range" id="rr" min="0" max="10" step="0.1" value="1"><output id="rro" style="width:32px">1.0x</output></label>
<label class="sl" title="Altruistic / Aggressive behavior"><span class="ic">⚔️</span><input type="range" id="bh" min="0" max="10" step="0.1" value="5"><output id="bho" style="width:32px">5.0x</output></label>
<label class="tg" title="Enable or disable tribe forming"><input type="checkbox" id="tribes" checked>Auto Swarming</label>
<button id="fsbtn" title="Fullscreen">⛶</button>
</header>

function sndInit(){ // browsers only allow audio after the first click or key press
  if(SND.ac||!(window.AudioContext||window.webkitAudioContext))return;

function trimSilence(b){ // mp3 files carry a little silence at both ends: find the real sound so the damage loop has no gap

{const fb=document.getElementById('fsbtn'),de=document.documentElement,on=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
 const upd=()=>{fb.innerHTML=FS_ICON(on());fb.title=on()?'Exit fullscreen':'Fullscreen';fb.classList.toggle('on',on())};

const SIM_HZ=60; // simulation steps per second at 1x
const FPS_CAP=120,FRAME=1000/FPS_CAP; // frame clamp: never draw more than 120 frames per second
let animT=0,animLast=0; // animation clock (ms): stands still while the game is paused
let lastDraw=0,lastNet=0,lastR=0,last=0,pT=0,acc=0,pf={n:0,work:0,draw:0,t:performance.now()};
function loop(t){{const d=Math.min(100,t-(animLast||t));animLast=t;if(running)animT+=d}
  if(t-lastR<FRAME-0.5){requestAnimationFrame(loop);return} // too early (screen faster than the clamp): skip this frame
  lastR=t-lastR>FRAME*2?t:lastR+FRAME;
  const s0=performance.now();
  // fixed simulation clock: SIM_HZ steps per second x speed, whatever the screen refresh rate is (a time budget keeps the page responsive when it cannot keep up)
  const dt=pT?Math.min(t-pT,100):16.667;pT=t;
  if(running){acc+=dt/(1000/SIM_HZ)*speed;const n=Math.floor(acc);acc-=n;let done=0;
    inSim=true;while(done<n){tick();done++;if(performance.now()-s0>22)break}inSim=false;
    if(done<n)acc=0}
  else acc=0;
  const s1=performance.now();

  sndUpdate();

  const s3=performance.now();

  pf.n++;pf.work+=s3-s0;pf.draw+=s2-s1;
  if(s3-pf.t>=500){const el=s3-pf.t,cpu=Math.min(100,pf.work/el*100),gpu=Math.min(100,pf.draw/el*100),e=document.getElementById('perf'),m=performance.memory,ram=m?(m.usedJSHeapSize/m.jsHeapSizeLimit*100).toFixed(1)+'%':'n/a';
    e.textContent=`Agents: ${agents.length} \u00b7 Tribes: ${TRIBES.length-freeTribes().length} \u00b7 FPS: ${Math.round(pf.n*1000/el)} \u00b7 CPU: ${Math.round(cpu)}% \u00b7 RAM: ${ram} \u00b7 GPU: ~${Math.round(gpu)}%`;
    pf.n=0;pf.work=0;pf.draw=0;pf.t=s3}
  requestAnimationFrame(loop);
}

// Top panel: every slider gets the same length, sized to the space the screen leaves so the bar fits one row
function fitSliders(){const h=document.querySelector('header'),n=h.querySelectorAll('.sl input').length,t=h.querySelector('h1'),L=document.getElementById('list'),N=document.getElementById('net'),wide=innerWidth>820,BTN=6;let w=0,E=0,gap=8;
  const z=zoomF();h.style.zoom=1/z;L.style.zoom=N.style.zoom=1/z;document.getElementById('perf').style.zoom=document.getElementById('log').style.zoom=1/z; // the side panels get the same counter-scaling, so their text matches the top panel
  const LW=()=>L.getBoundingClientRect().width,NW=()=>N.getBoundingClientRect().width; // browser zoom z: shrink the top bar by 1/z so it keeps the same size on screen (its inner sizes are then in units 1/z of page pixels)
  const ks=[...h.children].filter(k=>k!==t&&k.id!=='fsbtn'),pair=k=>k.tagName==='BUTTON'&&k.previousElementSibling&&k.previousElementSibling.tagName==='BUTTON';
  const ctlW=()=>{let b=0;for(const k of ks){const m=getComputedStyle(k);b+=k.offsetWidth+parseFloat(m.marginLeft)+parseFloat(m.marginRight)}return b+gap*(ks.length-1)};
  const reset=()=>ks.forEach(k=>{k.style.marginLeft=pair(k)?(BTN-gap)+'px':''}); // buttons sit close together (BTN px apart)
  for(let lv=0;lv<=3;lv++){ // try the roomy layout first, then step down to tighter spacing/fonts until every control fits in the single row
    h.className=lv?'c'+lv:'';h.style.setProperty('--sw','20px');
    const cs=getComputedStyle(h);gap=parseFloat(cs.columnGap)||8;reset();
    t.style.marginRight='0';t.style.overflow='hidden';t.style.textAlign='center';t.style.width=wide?Math.max(0,LW()*z-parseFloat(cs.paddingLeft)-gap)+'px':''; // title column = left panel width
    t.style.fontSize='';{let f=parseFloat(getComputedStyle(t).fontSize);while(wide&&t.scrollWidth>t.clientWidth+1&&f>10){f-=1;t.style.fontSize=f+'px'}} // shrink the title only as much as needed to fit its column
    E=wide?h.clientWidth-(LW()+NW())*z:h.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight); // width of the environment column
    {const fb=document.getElementById('fsbtn'),fw=fb&&fb.style.display!=='none'?fb.offsetWidth+24:0,x0=wide?LW()*z:parseFloat(cs.paddingLeft);E=Math.min(E,h.clientWidth-x0-fw)} // the controls never run under the fullscreen button in the top-right corner
    const loose=ks.length-1-ks.filter(pair).length; // intervals that get a normal gap (button-to-button ones do not)
    w=20+Math.floor((E-ctlW()-24-Math.max(4,16-4*lv)*loose)/n); // modest gaps between controls, the rest of the width goes to the sliders
    if(w>=36)break}
  h.style.setProperty('--sw',Math.max(20,Math.min(w,400))+'px');
  reset();
  if(wide&&ks.length>1){const side=12,loose=ks.length-1-ks.filter(pair).length,extra=Math.max(0,(E-ctlW()-2*side)/loose); // spread the controls from the left corner of the environment to the right corner
    ks.forEach((k,i)=>{if(!i)k.style.marginLeft=side+'px';else if(!pair(k))k.style.marginLeft=(extra+parseFloat(getComputedStyle(k).marginLeft||0))+'px'})}
  fit();
}
